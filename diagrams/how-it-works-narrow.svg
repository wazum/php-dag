<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="528" viewBox="0 0 344 528" role="img" aria-labelledby="how-it-works-narrow-title how-it-works-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="how-it-works-narrow-title">How php-dag works</title>
<desc id="how-it-works-narrow-desc">Your graph goes to the layout, a chain of processors that places nodes and routes edges, and that you can extend with processors of your own. The renderer draws the result into cells, and the output is plain or ANSI text.</desc>
<defs>
    <marker id="hiwn-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
    <marker id="hiwn-arrow-soft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#7a8399"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#hiwn-arrow)">
    <line x1="96" y1="88" x2="96" y2="128"/>
    <line x1="96" y1="192" x2="96" y2="232"/>
    <line x1="96" y1="296" x2="96" y2="336"/>
</g>
<line x1="208" y1="160" x2="176" y2="160" stroke="#7a8399" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#hiwn-arrow-soft)"/>

<g text-anchor="middle">
    <rect x="16" y="24" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="16" y="24" width="160" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="96" y="52" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Graph</text>
    <text x="96" y="72" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">nodes · edges</text>

    <rect x="16" y="128" width="160" height="64" rx="6" fill="#2d3142"/>
    <text x="96" y="156" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Layout</text>
    <text x="96" y="176" fill="#d6d7dc" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">places · routes</text>

    <rect x="16" y="232" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="96" y="260" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Renderer</text>
    <text x="96" y="280" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">draws the cells</text>

    <rect x="16" y="336" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="16" y="336" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="96" y="364" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Text</text>
    <text x="96" y="384" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">plain or ANSI</text>

    <rect x="208" y="128" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="208" y="128" width="120" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="268" y="156" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Processors</text>
    <text x="268" y="176" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">your own</text>
</g>

<line x1="16" y1="432" x2="328" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#4f5d75" letter-spacing="0.04em">
    <line x1="32" y1="464" x2="72" y2="464" stroke="#7a8399" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#hiwn-arrow-soft)"/>
    <text x="84" y="468">OPTIONAL</text>
    <rect x="40" y="488" width="20" height="16" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="84" y="500">YOUR CODE</text>
</g>
</svg>
